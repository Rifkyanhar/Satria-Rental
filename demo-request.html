<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Coba Demo — Satria Rental</title>
<meta name="theme-color" content="#1B1D1F">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="auth-screen">
  <div class="auth-box">
    <div class="brand-name" style="text-align:center; margin-bottom:4px;">SATRIA RENTAL</div>
    <div class="brand-stripe" style="margin:0 auto 8px;"></div>
    <p style="text-align:center; color:var(--chrome); font-size:.85rem; margin-bottom:22px;">Sistem Manajemen Rental Mobil</p>

    <div id="formView">
      <p class="hint" style="margin-bottom:16px;">Isi data di bawah untuk mendapatkan akses demo gratis ke sistem ini.</p>
      <div class="field"><label>Nama Anda</label><input id="leadNama" placeholder="Nama lengkap"></div>
      <div class="field"><label>Email</label><input id="leadEmail" type="email" placeholder="email@perusahaan.com"></div>
      <p id="leadError" class="auth-error"></p>
      <button class="btn btn-primary btn-block" id="leadSubmitBtn" onclick="submitLead()">Kirim & Dapatkan Akses Demo</button>
    </div>

    <div id="successView" style="display:none; text-align:center;">
      <p style="font-size:2rem; margin-bottom:8px;">✅</p>
      <p style="font-weight:600; margin-bottom:6px;">Berhasil dikirim!</p>
      <p class="hint">Cek inbox (atau folder spam) email Anda — data login demo sudah kami kirimkan ke sana.</p>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://utytmeyetfzyxcvbsrxa.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0eXRtZXlldGZ6eXhjdmJzcnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0NDAxMjUsImV4cCI6MjEwMDAxNjEyNX0.dj7tyOfVjj7hau9X--PbVBh9I5Uyp73QGfsLr8fEPdA';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function submitLead(){
    const errEl = document.getElementById('leadError');
    errEl.textContent = '';
    const nama = document.getElementById('leadNama').value.trim();
    const email = document.getElementById('leadEmail').value.trim();
    if(!nama || !email){ errEl.textContent = 'Isi nama dan email dulu ya.'; return; }

    const btn = document.getElementById('leadSubmitBtn');
    const original = btn.textContent;
    btn.textContent = 'Mengirim...'; btn.disabled = true;

    try{
      const { data: leadRow, error: insertErr } = await sb.from('leads').insert({ nama, email }).select().single();
      if(insertErr) throw insertErr;

      const { error: fnErr } = await sb.functions.invoke('send-demo-email', {
        body: { nama, email, leadId: leadRow.id }
      });
      if(fnErr) throw fnErr;

      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    }catch(e){
      errEl.textContent = 'Gagal: ' + (e.message || e);
      btn.textContent = original; btn.disabled = false;
    }
  }
</script>
</body>
</html>
