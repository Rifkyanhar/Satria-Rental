<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Satria Rental — Manajemen Armada</title>
<meta name="theme-color" content="#1B1D1F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" onerror="this.onerror=null; var s=document.createElement('script'); s.src='https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'; document.head.appendChild(s);"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js" onerror="this.onerror=null; var s=document.createElement('script'); s.src='https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js'; document.head.appendChild(s);"></script>
</head>
<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <div class="brand-name" style="text-align:center; margin-bottom:4px;">SATRIA RENTAL</div>
    <div class="brand-stripe" style="margin:0 auto 22px;"></div>

    <div id="loginBox">
      <div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="staf@satriarental.com"></div>
      <div class="field"><label>Password</label><input id="authPassword" type="password" placeholder="Minimal 6 karakter"></div>
      <p style="text-align:right; margin-top:-8px; margin-bottom:10px;">
        <a href="#" onclick="showForgotBox(); return false;" style="font-size:.8rem; color:var(--chrome-dim);">Lupa Password?</a>
      </p>
      <p id="authError" class="auth-error"></p>
      <button class="btn btn-primary btn-block" onclick="handleLogin()">Masuk</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="handleSignup()">Buat Akun Staf Baru</button>
      <p class="hint" style="text-align:center; margin-top:14px;">Akun ini untuk Anda dan staf yang boleh mengakses data rental. Jangan bagikan ke pihak luar.</p>
    </div>

    <div id="forgotBox" style="display:none;">
      <h3 style="text-align:center; margin-bottom:16px;">Lupa Password</h3>
      <p class="hint" style="text-align:center; margin-bottom:16px;">Masukkan email akun Anda. Kami akan kirim link untuk atur ulang password.</p>
      <div class="field"><label>Email</label><input id="forgotEmail" type="email" placeholder="staf@satriarental.com"></div>
      <p id="forgotError" class="auth-error"></p>
      <button class="btn btn-primary btn-block" onclick="handleForgotPassword()">Kirim Link Reset</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="showLoginBox()">Kembali ke Login</button>
    </div>
  </div>
</div>

<div id="resetScreen" class="auth-screen" style="display:none;">
  <div class="auth-box">
    <div class="brand-name" style="text-align:center; margin-bottom:4px;">SATRIA RENTAL</div>
    <div class="brand-stripe" style="margin:0 auto 22px;"></div>
    <h3 style="text-align:center; margin-bottom:16px;">Atur Ulang Password</h3>
    <div class="field"><label>Password Baru</label><input id="newPassword" type="password" placeholder="Minimal 6 karakter"></div>
    <p id="resetError" class="auth-error"></p>
    <button class="btn btn-primary btn-block" onclick="handleResetPassword()">Simpan Password Baru</button>
  </div>
</div>

<div id="mainApp" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <span class="brand-name" id="brandName">SATRIA RENTAL</span>
      <span class="brand-stripe"></span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="icon-btn" id="logoutBtn" title="Keluar">⏻</button>
      <button class="icon-btn" id="settingsBtn" title="Pengaturan">⚙</button>
    </div>
  </header>
  <main id="app"></main>
  <nav class="tabbar">
    <button class="tab active" data-view="dashboard"><span class="tab-ic">◉</span><span>Dasbor</span></button>
    <button class="tab" data-view="armada"><span class="tab-ic">🚗</span><span>Armada</span></button>
    <button class="tab" data-view="penyewa"><span class="tab-ic">🪪</span><span>Penyewa</span></button>
    <button class="tab" data-view="kontrak"><span class="tab-ic">📄</span><span>Kontrak</span></button>
    <button class="tab" data-view="blacklist"><span class="tab-ic">⛔</span><span>Blacklist</span></button>
  </nav>
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modalBody"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
