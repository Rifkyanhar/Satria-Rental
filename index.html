<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Satria Rental — Manajemen Armada</title>
<meta name="theme-color" content="#1B1D1F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-name" id="brandName">SATRIA RENTAL</span>
    <span class="brand-stripe"></span>
  </div>
  <button class="icon-btn" id="settingsBtn" title="Pengaturan">⚙</button>
</header>

<main id="app"></main>

<nav class="tabbar">
  <button class="tab active" data-view="dashboard"><span class="tab-ic">◉</span><span>Dasbor</span></button>
  <button class="tab" data-view="armada"><span class="tab-ic">🚗</span><span>Armada</span></button>
  <button class="tab" data-view="penyewa"><span class="tab-ic">🪪</span><span>Penyewa</span></button>
  <button class="tab" data-view="kontrak"><span class="tab-ic">📄</span><span>Kontrak</span></button>
  <button class="tab" data-view="blacklist"><span class="tab-ic">⛔</span><span>Blacklist</span></button>
</nav>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBody"></div>
</div>

<script src="app.js"></script>
</body>
</html>
